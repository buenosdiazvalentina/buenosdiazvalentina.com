<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="buenosdiazvalentina — obras">
  <title>BUENOSDIAZVALENTINA</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Estilos estéticos avanzados estilo editorial boutique */
    body {
        background-color: #fcfcfc;
        color: #2c2c2c;
    }
    .site-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 25px 40px;
        background: rgba(252, 252, 252, 0.95);
        border-bottom: 1px solid #f0f0f0;
        z-index: 1000;
    }
    /* Nombre al centro en mayúscula */
    .site-header h1 {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
    }
    .site-header h1 a {
        text-decoration: none;
        color: #1a1a1a;
        font-weight: 400;
        letter-spacing: 0.2em;
        font-size: 0.9rem;
        text-transform: uppercase;
    }
    .site-header h1 a:hover {
        color: #777777;
    }
    /* Menú a la izquierda */
    .menu-hamburguesa {
        position: relative;
        z-index: 1101;
    }
    .btn-menu-lineas {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 22px;
        height: 14px;
        padding: 0;
    }
    .btn-menu-lineas span {
        display: block;
        width: 100%;
        height: 1px;
        background-color: #1a1a1a;
        transition: transform 0.3s ease;
    }
    .dropdown-contacto {
        position: absolute;
        top: 35px;
        left: 0;
        background: #ffffff;
        border: 1px solid #eaeaea;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        display: none;
        flex-direction: column;
        gap: 16px;
        z-index: 1100;
        min-width: 220px;
    }
    .dropdown-contacto.activo {
        display: flex;
    }
    .dropdown-contacto a, .dropdown-contacto button {
        color: #2c2c2c;
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: lowercase;
        background: none;
        border: none;
        text-align: left;
        cursor: pointer;
        padding: 0;
        font-family: inherit;
    }
    .dropdown-contacto a:hover, .dropdown-contacto button:hover {
        color: #777777;
    }
    /* Galería y textos en negro y gris */
    .galeria-obras {
        max-width: 1600px;
        margin: 0 auto;
        padding: 140px 40px 80px 40px;
    }
    .grid-galeria {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 60px 30px;
    }
    .tarjeta-obra {
        cursor: pointer;
    }
    .tarjeta-obra img {
        width: 100%;
        height: auto;
        display: block;
        transition: opacity 0.3s ease;
    }
    .tarjeta-obra img:hover {
        opacity: 0.8;
    }
    .btn-volver {
        background: none;
        border: none;
        font-size: 0.85rem;
        letter-spacing: 0.15em;
        color: #555555;
        cursor: pointer;
        text-transform: lowercase;
        padding: 10px 20px;
    }
    .btn-volver:hover {
        color: #1a1a1a;
    }
    /* Fondo de explorar obras en un gris más claro */
    .texto-explorar {
        color: #2c2c2c;
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: rgba(230, 230, 230, 0.85);
        padding: 10px 20px;
        border-radius: 20px;
        backdrop-filter: blur(4px);
    }

    /* Estilos para el Modal / Vista Detalle de la Obra */
    .modal-obra {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(252, 252, 252, 0.96);
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }
    .modal-obra.activo {
        display: flex;
    }
    .modal-contenido {
        display: flex;
        max-width: 1100px;
        width: 100%;
        gap: 60px;
        align-items: center;
    }
    .modal-imagen-contenedor {
        flex: 1;
        max-height: 80vh;
        display: flex;
        justify-content: center;
    }
    .modal-imagen-contenedor img {
        max-width: 100%;
        max-height: 75vh;
        object-fit: contain;
    }
    .modal-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .modal-info h3 {
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.15em;
        text-transform: lowercase;
        color: #1a1a1a;
    }
    .modal-info p {
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        color: #666666;
        text-transform: lowercase;
        line-height: 1.6;
    }
    .btn-cerrar-modal {
        position: absolute;
        top: 30px;
        right: 40px;
        background: none;
        border: none;
        font-size: 1rem;
        letter-spacing: 0.1em;
        cursor: pointer;
        color: #1a1a1a;
        text-transform: lowercase;
    }
    .btn-cerrar-modal:hover {
        color: #777777;
    }

    @media (max-width: 900px) {
        .grid-galeria {
            grid-template-columns: 1fr;
            gap: 40px;
        }
        .site-header {
            padding: 20px;
        }
        .modal-contenido {
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: 90vh;
        }
        .modal-obra {
            padding: 20px;
            align-items: flex-start;
            padding-top: 80px;
        }
    }
  </style>
</head>
<body>

    <!-- CABECERA ESTILO EDITORIAL -->
    <header class="site-header">
        <!-- Menú de líneas a la izquierda -->
        <div class="menu-hamburguesa">
            <button class="btn-menu-lineas" id="btnMenuToggle" aria-label="Menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="dropdown-contacto" id="menuDropdown">
                <button id="btnIrGaleria">obras</button>
                <a href="mailto:Buenosdiazvalentina@gmail.com">contacto: Buenosdiazvalentina@gmail.com</a>
            </div>
        </div>

        <!-- Nombre al centro en Mayúscula -->
        <h1><a href="#" id="linkHome">BUENOSDIAZVALENTINA</a></h1>
        
        <!-- Espaciador invisible para equilibrar el flexbox -->
        <div style="width: 22px;"></div>
    </header>

    <main class="site-main">
        <!-- 1. SECCIÓN DE PORTADA -->
        <section class="seccion-portada" id="seccionPortada">
            <div class="contenedor-video" id="btnMostrarGaleria" title="Haz clic para ver las obras">
                <video autoplay muted loop playsinline class="video-portada" id="videoPortada">
                    <source src="Portada1.mp4" type="video/mp4">
                    Tu navegador no soporta videos HTML5.
                </video>
                <div class="capa-interaccion">
                    <span class="texto-explorar">explorar obras [ + ]</span>
                </div>
            </div>
        </section>

        <!-- 2. SECCIÓN DE LA GALERÍA DE OBRAS -->
        <section class="galeria-obras oculto" id="seccionGaleria">
            <div class="grid-galeria">
                <div class="tarjeta-obra" data-titulo="obra 1" data-tecnica="técnica mixta sobre papel" data-medidas="50 x 70 cm" data-anio="2026" data-img="Obra1.png">
                    <img src="Obra1.png" alt="Obra de arte 1">
                </div>
                
                <div class="tarjeta-obra" data-titulo="obra 2" data-tecnica="acuarela sobre papel" data-medidas="50 x 70 cm" data-anio="2026" data-img="Obra2.png">
                    <img src="Obra2.png" alt="Obra de arte 2">
                </div>
                
                <div class="tarjeta-obra" data-titulo="obra 3" data-tecnica="acuarela sobre papel" data-medidas="50 x 70 cm" data-anio="2026" data-img="Obra3.png">
                    <img src="Obra3.png" alt="Obra de arte 3">
                </div>

                <div class="tarjeta-obra" data-titulo="Obra 4" data-tecnica="acuarela y tinta" data-medidas="50 x 70 cm" data-anio="2026" data-img="Obra4.png">
                    <img src="Obra4.png" alt="Obra de arte 4">
                </div>
                
                <div class="tarjeta-obra" data-titulo="Obra 5" data-tecnica="acuarela sobre papel" data-medidas="50 x 70 cm" data-anio="2026" data-img="Obra5.png">
                    <img src="Obra5.png" alt="Obra de arte 5">
                </div>
                
                <div class="tarjeta-obra" data-titulo="Obra 6" data-tecnica="acuarela sobre papel" data-medidas="50 x 70 cm" data-anio="2026" data-img="Obra6.png">
                    <img src="Obra6.png" alt="Obra de arte 6">
                </div>
            </div>
            
            <div class="contenedor-volver" style="text-align: center; margin-top: 60px;">
                <button class="btn-volver" id="btnVolver">← volver al inicio</button>
            </div>
        </section>
    </main>

    <!-- MODAL / VISTA DETALLE DE LA OBRA -->
    <div class="modal-obra" id="modalObra">
        <button class="btn-cerrar-modal" id="btnCerrarModal">cerrar [ × ]</button>
        <div class="modal-contenido">
            <div class="modal-imagen-contenedor">
                <img id="modalImg" src="" alt="Vista ampliada de la obra">
            </div>
            <div class="modal-info">
                <h3 id="modalTitulo">título de la obra</h3>
                <p id="modalTecnica">técnica: --</p>
                <p id="modalMedidas">medidas: --</p>
                <p id="modalAnio">año: --</p>
            </div>
        </div>
    </div>

    <!-- Script de control -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const videoPortada = document.getElementById("videoPortada");
            if (videoPortada) {
                videoPortada.play().catch(error => {
                    console.log("Reproducción automática gestionada por política del navegador:", error);
                });
            }

            const btnMostrarGaleria = document.getElementById("btnMostrarGaleria");
            const btnIrGaleria = document.getElementById("btnIrGaleria");
            const linkHome = document.getElementById("linkHome");
            const seccionPortada = document.getElementById("seccionPortada");
            const seccionGaleria = document.getElementById("seccionGaleria");
            const btnVolver = document.getElementById("btnVolver");
            
            const btnMenuToggle = document.getElementById("btnMenuToggle");
            const menuDropdown = document.getElementById("menuDropdown");

            // Elementos del Modal
            const modalObra = document.getElementById("modalObra");
            const modalImg = document.getElementById("modalImg");
            const modalTitulo = document.getElementById("modalTitulo");
            const modalTecnica = document.getElementById("modalTecnica");
            const modalMedidas = document.getElementById("modalMedidas");
            const modalAnio = document.getElementById("modalAnio");
            const btnCerrarModal = document.getElementById("btnCerrarModal");
            const tarjetasObra = document.querySelectorAll(".tarjeta-obra");

            btnMenuToggle.addEventListener("click", (e) => {
                e.stopPropagation();
                menuDropdown.classList.toggle("activo");
            });

            document.addEventListener("click", () => {
                menuDropdown.classList.remove("activo");
            });

            function mostrarGaleria() {
                seccionPortada.classList.add("oculto");
                seccionGaleria.classList.remove("oculto");
                menuDropdown.classList.remove("activo");
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function mostrarPortada() {
                seccionGaleria.classList.add("oculto");
                seccionPortada.classList.remove("oculto");
                menuDropdown.classList.remove("activo");
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (videoPortada) {
                    videoPortada.play().catch(() => {});
                }
            }

            btnMostrarGaleria.addEventListener("click", mostrarGaleria);
            btnIrGaleria.addEventListener("click", mostrarGaleria);
            linkHome.addEventListener("click", (e) => {
                e.preventDefault();
                mostrarPortada();
            });

            if (btnVolver) {
                btnVolver.addEventListener("click", mostrarPortada);
            }

            // Lógica para abrir el modal con la ficha técnica de cada obra
            tarjetasObra.forEach(tarjeta => {
                tarjeta.addEventListener("click", () => {
                    modalImg.src = tarjeta.getAttribute("data-img");
                    modalTitulo.textContent = tarjeta.getAttribute("data-titulo");
                    modalTecnica.textContent = "técnica: " + tarjeta.getAttribute("data-tecnica");
                    modalMedidas.textContent = "medidas: " + tarjeta.getAttribute("data-medidas");
                    modalAnio.textContent = "año: " + tarjeta.getAttribute("data-anio");
                    
                    modalObra.classList.add("activo");
                });
            });

            // Lógica para cerrar el modal
            function cerrarModal() {
                modalObra.classList.remove("activo");
            }

            btnCerrarModal.addEventListener("click", cerrarModal);
            modalObra.addEventListener("click", (e) => {
                if (e.target === modalObra) {
                    cerrarModal();
                }
            });
        });
    </script>
</body>
</html>
